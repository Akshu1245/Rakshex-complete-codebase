# RaksHex Agent Firewall API — Cloudflare Workers
# ADDITIVE PORT: the Express app (apps/api) stays intact. Nothing here deploys
# until boss creates a Cloudflare account and fills every REPLACE_ME placeholder
# below (values shown are format-valid dummies so `wrangler dev` boots locally).
name = "rakshex-firewall"
main = "src/index.ts"
compatibility_date = "2025-08-23"
compatibility_flags = ["nodejs_compat"] # @sentry/cloudflare needs node:async_hooks

[vars]
ENVIRONMENT = "production"

# Secrets (set via `wrangler secret put`, NEVER in this file):
#   RECEIPT_SIGNING_PRIVATE_KEY — Ed25519 PKCS8 DER, base64-encoded
#   RECEIPT_SIGNING_KEY_ID      — e.g. "rakshex-receipts-2026-09"
#   API_KEY_PEPPER              — HMAC pepper for workers-provisioned API keys
#   SENTRY_DSN                  — optional

[[d1_databases]]
binding = "DB"
database_name = "rakshex-firewall"
# Paste the real D1 database_id from the Cloudflare dashboard
database_id = "b5997465-c78e-4f91-8f25-a53975c9b971"
migrations_dir = "drizzle"

[[kv_namespaces]]
binding = "KV_CONFIG"
# Paste the real KV namespace id
id = "579f6fea6c6142cbafe3d5ae04e10510"

[[queues.producers]]
binding = "EVAL_QUEUE"
# REPLACE_ME: paste the real queue name
queue = "rakshex-eval-jobs"

[[queues.consumers]]
# REPLACE_ME: paste the real queue name
queue = "rakshex-eval-jobs"
max_batch_size = 10
max_retries = 3

[[r2_buckets]]
binding = "RECEIPT_BUCKET"
# REPLACE_ME: paste the real R2 bucket name
bucket_name = "rakshex-receipt-bundles"

[triggers]
crons = [
  "*/15 * * * *", # provider reconciliation fan-out
  "0 9 * * 1",    # weekly digest fan-out (Mon 09:00)
]
