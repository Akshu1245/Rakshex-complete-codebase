# Complete Next.js frontend, isolated Cloudflare staging ONLY.
name = "rakshex-web-opennext-staging"
main = ".open-next/worker.js"
compatibility_date = "2026-10-12"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
RAKSHEX_DEPLOY_TARGET = "cloudflare"
RAKSHEX_CLOUDFLARE_ENV = "staging"
RAKSHEX_BACKEND_URL = "https://rakshex-core-staging.rakshex.workers.dev"
NEXT_PUBLIC_TS_API_URL = "https://rakshex-core-staging.rakshex.workers.dev"
NEXT_PUBLIC_SITE_URL = "https://rakshex-web-opennext-staging.rakshex.workers.dev"
NEXTAUTH_URL = "https://rakshex-web-opennext-staging.rakshex.workers.dev"

[observability]
enabled = true
