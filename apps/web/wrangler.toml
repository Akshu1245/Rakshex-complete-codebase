# RaksHex Web (Next.js) — Cloudflare Workers
# ADDITIVE PORT: the Vercel target (vercel.json) stays intact. This file is only
# used by `opennextjs-cloudflare build` / `wrangler dev|deploy`.
# Account: "Rakshex@gmail.com's Account" (b3225f198c6d2286afbb6f416c230f10).
#
# Build:  RAKSHEX_API_ORIGIN=https://<api-worker>.workers.dev pnpm build:cf
#         (opennextjs-cloudflare build -> next build -> .open-next/worker.js)
# Local:  pnpm preview:cf   (builds, then `wrangler dev` on .open-next/worker.js)
# Deploy: pnpm deploy:cf    (builds, then uploads; needs CLOUDFLARE_API_TOKEN)
#
# Backend origin: rewrites (/api/trpc/* etc.) are baked at build time from
# RAKSHEX_API_ORIGIN (preferred) or RAKSHEX_BACKEND_URL — see next.config.js.
# Set it in the shell when building; never rely on the Railway fallback here.
#
# NOTE (2026-09-25): workers.dev subdomain is live: rakshex.workers.dev.
# API origin:    https://rakshex-firewall.rakshex.workers.dev
# Web origin:    https://rakshex-web.rakshex.workers.dev
name = "rakshex-web"
account_id = "b3225f198c6d2286afbb6f416c230f10"
main = ".open-next/worker.js"
compatibility_date = "2026-09-25"
compatibility_flags = ["nodejs_compat"] # next-auth + node:async_hooks need node:* APIs

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
ENVIRONMENT = "production"
# Backend origin: rewrites (/api/trpc/* etc.) are baked at build time from this var.
RAKSHEX_API_ORIGIN = "https://rakshex-firewall.rakshex.workers.dev"
# Public site URL (live on Vercel today).
NEXT_PUBLIC_SITE_URL = "https://rakshex.in"
# Web worker origin (required by next-auth; without it OAuth callback URLs point at localhost).
NEXTAUTH_URL = "https://rakshex-web.rakshex.workers.dev"

# Secrets (set via `wrangler secret put`, NEVER in this file):
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET   — next-auth Google provider
#   GITHUB_ID / GITHUB_SECRET                  — next-auth GitHub provider
#   NEXTAUTH_SECRET                            — next-auth JWT signing

# Service binding to the firewall API worker. REQUIRED: a Worker cannot fetch
# another Worker's public *.workers.dev URL on the same account — Cloudflare
# blocks it with HTTP 404 "error code: 1042". Service bindings route internally.
[[services]]
binding = "RAKSHEX_API"
service = "rakshex-firewall"
