packages:
  - "apps/*"
  - "packages/*"
  - "github-action"

allowBuilds:
  "@sentry/cli": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  unrs-resolver: true

overrides:
  qs: "6.15.2"
  ws: "8.21.0"
  postcss: "8.5.26"
  esbuild: "0.28.1"
  form-data: "4.0.6"
  undici: "8.7.0"
  nodemailer: "10.0.6"
  sharp: "0.35.5"
  next: "16.3.6"
  multer: "2.3.0"
  axios: "1.20.0"
  "proxy-addr": "2.0.8"
  "engine.io": "6.6.10"
  "@grpc/grpc-js": "1.14.5"
  "source-map-js": "1.2.2"
  compression: "1.8.2"
  "@opentelemetry/core": "2.9.0"
  "@napi-rs/wasm-runtime": "1.1.6"
  # GHSA-2v37-7h3g-55p8 — custom generators can loop indefinitely when size
  # is zero. postcss 8.5.24 pulled nanoid 3.3.16; 8.5.26 depends on ^3.3.17
  # and resolves to 3.3.18. Pin the 3.x line explicitly so any other path
  # cannot regress below the patched release.
  "nanoid@<3.3.18": "3.3.18"
  # GHSA-rgw5-rvv9-x895 / CVE-2026-69152 — DoS via unbounded intermediate
  # arrays, which bypasses the earlier CVE-2026-14257 mitigation. Vulnerable
  # <5.0.9 on 5.x, <1.1.18 on 1.x. The previous pins missed the 1.x line that
  # minimatch@3 still pulls; Trivy flags it HIGH in the API image.
  "brace-expansion@<1.1.18": "1.1.18"
  "brace-expansion@2.1.3": "2.1.6"
  "brace-expansion@2.1.4": "2.1.6"
  "brace-expansion@5.0.9": "5.0.11"
  "brace-expansion@>=2.0.0 <2.1.6": "2.1.6"
  "brace-expansion@>=4.0.0 <5.0.11": "5.0.11"
  "brace-expansion@>=3.0.0": "5.0.11"
  # GHSA-5p4m-2wfm-xmqj — quadratic CPU in !!omap resolution (CVE-2026-59870).
  # Transitive via @eslint/eslintrc; the production image currently copies the
  # full install, so Trivy sees it.
  "js-yaml@>=4.0.0 <4.3.1": "4.3.1"
  # GHSA-7p8r-x3mc-p8w7 — patched in 4.1.2; 4.1.1 was likewise one short.
  "fast-uri@>=3.0.0": "4.1.2"
  # GHSA — vitest security advisories; pin patched 4.1.11+ across the monorepo.
  vitest: "4.1.11"
