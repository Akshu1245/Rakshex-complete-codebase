name: CF03 formatter one-shot

on:
  push:
    branches: [feat/cloudflare-full-web-staging-20261012]
    paths: [".github/workflows/cf03-format-once.yml"]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cloudflare-full-web-staging-20261012
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm exec prettier --write scripts/cloudflare/patch-opennext-preview-props.mjs
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/cloudflare/patch-opennext-preview-props.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(cloudflare): normalize manifest workaround"
            git push origin HEAD:refs/heads/feat/cloudflare-full-web-staging-20261012
          fi
