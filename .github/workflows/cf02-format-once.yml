name: CF02 formatter one-shot

on:
  push:
    branches: [feat/cloudflare-migrate-runtime-20261012]
    paths: [".github/workflows/cf02-format-once.yml"]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cloudflare-migrate-runtime-20261012
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/cloudflare/CF02_RUNTIME_MIGRATION.md scripts/cloudflare/core-runtime.test.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cloudflare/CF02_RUNTIME_MIGRATION.md scripts/cloudflare/core-runtime.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(cloudflare): format CF02 migration files"
            git push origin HEAD:refs/heads/feat/cloudflare-migrate-runtime-20261012
          fi
