name: One-time action class formatting
on:
  push:
    branches:
      - design/action-class-matrix-fail-closed-20261013
    paths:
      - .github/workflows/action-class-format-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'Akshu1245/Rakshex-complete-codebase'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/action-class-matrix-fail-closed-20261013
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - name: Format only proposed new files
        run: pnpm exec prettier --write packages/action-control/src/actionClasses.ts packages/action-control/src/actionClasses.test.ts docs/architecture/ACTION_PATH_FINAL.md
      - name: Commit formatting only if necessary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/action-control/src/actionClasses.ts packages/action-control/src/actionClasses.test.ts docs/architecture/ACTION_PATH_FINAL.md
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply pinned Prettier to action-class architecture'
            git push origin HEAD:design/action-class-matrix-fail-closed-20261013
          fi
