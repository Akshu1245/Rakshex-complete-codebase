name: Cloudflare application control API
on:
  pull_request:
    paths:
      - "cloudflare/app/**"
      - "packages/action-control/**"
      - "scripts/cloudflare/app-runtime.test.mjs"
      - "scripts/cloudflare/session-core.test.mjs"
      - "scripts/cloudflare/browser-access.test.mjs"
      - ".github/workflows/cloudflare-app.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint cloudflare/app/*.mjs --max-warnings=0
      - run: node --test scripts/cloudflare/app-runtime.test.mjs scripts/cloudflare/session-core.test.mjs scripts/cloudflare/browser-access.test.mjs
      - run: pnpm --filter @rakshex/action-control test
