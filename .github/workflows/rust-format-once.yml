name: One-time Rust migration formatting

on:
  push:
    branches:
      - feat/rust-action-engine-foundation-20261013
    paths:
      - .github/workflows/rust-format-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'Akshu1245/Rakshex-complete-codebase'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rust-action-engine-foundation-20261013
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: cargo fmt --manifest-path rust/action-core/Cargo.toml --all
      - run: pnpm exec prettier --write packages/action-control/src/rustParity.test.ts docs/architecture/RUST_REBUILD_PLAN.md .github/workflows/rust-action-core.yml
      - name: Commit exact pinned formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/action-core/src/lib.rs packages/action-control/src/rustParity.test.ts docs/architecture/RUST_REBUILD_PLAN.md .github/workflows/rust-action-core.yml
          if ! git diff --cached --quiet; then
            git commit -m 'style(rust): format Rust and migration contracts'
            git push origin HEAD:feat/rust-action-engine-foundation-20261013
          fi
