name: P1/P2 dashboard integration gate
on:
  pull_request:
    paths:
      - "devpulse-dashboard-ui/**"
      - ".github/workflows/p1p2-dashboard.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p1p2-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: devpulse-dashboard-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: devpulse-dashboard-ui/package-lock.json
      - name: Install pinned dashboard dependencies
        run: npm ci
      - name: Focused report UI regression tests
        run: npm test -- --watch=false --runInBand ImpactReviewPanel
      - name: Dashboard typecheck
        run: npx tsc --noEmit
      - name: Dashboard production build
        run: npm run build
