name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  cloudflare-container-build:
    name: Cloudflare Backend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate production configuration
        working-directory: cloudflare-backend
        run: |
          python -m unittest test_production_config.py
          node --test runtime-config.test.mjs
      - name: Install Worker dependencies
        working-directory: cloudflare-backend
        run: npm ci --workspaces=false
      - name: Validate Worker bundle
        working-directory: cloudflare-backend
        run: npx wrangler deploy --dry-run --containers-rollout=none
      - name: Build FastAPI container
        run: docker build -f cloudflare-backend/Dockerfile .

  full-stack-postgres:
    name: Full Stack PostgreSQL Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated test configuration
        run: |
          python - <<'PY'
          import secrets
          from pathlib import Path
          Path('devpulse-backend/.env').write_text('JWT_SECRET=' + secrets.token_urlsafe(48) + '\nFRONTEND_URL=http://localhost:3000\n')
          PY
      - name: Build and start both applications with PostgreSQL
        run: |
          docker compose up --build -d || {
            docker compose logs --no-color backend frontend
            exit 1
          }
      - name: Verify browser-facing API and persistent data
        run: python scripts/smoke_stack.py
      - name: Verify live WebSocket health updates
        run: |
          docker compose exec -T backend python - <<'PY'
          import asyncio, json, websockets
          async def check():
              async with websockets.connect('ws://localhost:8000/ws/health') as socket:
                  assert json.loads(await socket.recv())['type'] == 'health_update'
                  await socket.send('refresh')
                  assert json.loads(await socket.recv())['type'] == 'health_update'
              print('WebSocket handshake and refresh verified')
          asyncio.run(check())
          PY
      - name: Stop isolated test stack
        if: always()
        run: docker compose down

  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('devpulse-backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: devpulse-backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: devpulse-backend
        run: python -m pytest tests/ -v --tb=short

  frontend-tests:
    name: Frontend Tests (Node.js)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: devpulse-dashboard-ui/package-lock.json

      - name: Install dependencies
        working-directory: devpulse-dashboard-ui
        run: npm ci

      - name: Type check
        working-directory: devpulse-dashboard-ui
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: devpulse-dashboard-ui
        run: npm test

      - name: Build frontend and runtime API routes
        working-directory: devpulse-dashboard-ui
        run: npm run build

  frontend-e2e:
    name: Frontend E2E Tests (Cypress)
    runs-on: ubuntu-latest
    needs: frontend-tests
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: devpulse-dashboard-ui/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        working-directory: devpulse-dashboard-ui
        run: npm ci

      - name: Install backend dependencies
        working-directory: devpulse-backend
        run: pip install -r requirements.txt

      - name: Verify browser request contracts against FastAPI
        run: python scripts/check_browser_contracts.py

      - name: Start backend
        working-directory: devpulse-backend
        run: python -m uvicorn main:app --host 0.0.0.0 --port 8000 &

      - name: Start frontend
        working-directory: devpulse-dashboard-ui
        run: npm run dev &
        env:
          BACKEND_URL: http://localhost:8000

      - name: Wait for servers to be ready
        run: |
          npx --yes wait-on http-get://localhost:5000 http-get://localhost:8000/health --timeout 60000

      - name: Run Cypress E2E tests
        working-directory: devpulse-dashboard-ui
        run: npm run test:e2e
        env:
          CYPRESS_BASE_URL: http://localhost:5000
