name: Cloudflare frontend compatibility

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/cloudflare-frontend-compat.yml"
      - "cloudflare/staging/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vinext-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Next.js 16 compatibility with Cloudflare vinext
        working-directory: apps/web
        env:
          RAKSHEX_DEPLOY_TARGET: cloudflare
          RAKSHEX_CLOUDFLARE_ENV: staging
          RAKSHEX_BACKEND_URL: https://rakshex-core-staging.rakshex.workers.dev
        run: |
          pnpm dlx vinext check | tee ../../vinext-compatibility.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vinext-compatibility
          path: vinext-compatibility.log
          if-no-files-found: ignore
