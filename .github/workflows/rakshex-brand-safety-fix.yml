name: RaksHex one-time brand safety fix

on:
  push:
    branches:
      - investor-beta-ui-pass

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v4
        with:
          ref: investor-beta-ui-pass
          fetch-depth: 0
          persist-credentials: true

      - name: Fix mechanical rename regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'apps/api/services/vault.ts',
              ' * Legacy RAKSHEX_VAULT_KEY is accepted only as a temporary migration fallback.\n',
              '',
          )
          replace(
              'apps/api/services/vault.ts',
              '  const key = process.env.RAKSHEX_VAULT_KEY?.trim() || process.env.RAKSHEX_VAULT_KEY?.trim();',
              '  const key = process.env.RAKSHEX_VAULT_KEY?.trim();',
          )

          duplicate_vault_check = '(process.env.RAKSHEX_VAULT_KEY ?? process.env.RAKSHEX_VAULT_KEY ?? "").trim().length >= 32'
          single_vault_check = '(process.env.RAKSHEX_VAULT_KEY ?? "").trim().length >= 32'
          for test_file in (
              'apps/api/api/agentFirewall.broker.http.test.ts',
              'apps/api/api/agentFirewall.e2e.test.ts',
          ):
              replace(test_file, duplicate_vault_check, single_vault_check)

          replace(
              'apps/api/runtimeClaims.test.ts',
              '  it("does not reintroduce the retired brand or unsupported proof claims", () => {',
              '  it("does not contain unsupported proof claims", () => {',
          )
          replace(
              'apps/api/runtimeClaims.test.ts',
              '      /RaksHex/i,\n',
              '',
          )

          replace(
              'vitest.config.ts',
              '      "rakshex-frontend/**",\n      "rakshex-vscode/**",\n      "rakshex-frontend/**",\n      "rakshex-vscode/**",\n',
              '      "rakshex-frontend/**",\n      "rakshex-vscode/**",\n',
          )
          PY

      - name: Remove merged stale branch with retired naming
        shell: bash
        run: |
          OLD_BRANCH="cursor/complete-""dev""pulse-features-abd6"
          if git ls-remote --exit-code --heads origin "$OLD_BRANCH" >/dev/null 2>&1; then
            git push origin --delete "$OLD_BRANCH"
          fi

      - name: Remove this one-time workflow
        shell: bash
        run: rm -f .github/workflows/rakshex-brand-safety-fix.yml

      - name: Verify active tree and remote refs contain no retired naming
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          needles = (
              'DevPulse', 'devpulse', 'DEVPULSE',
              'Dev Pulse', 'dev pulse', 'DEV PULSE',
              'Dev-Pulse', 'dev-pulse', 'DEV-PULSE',
              'Dev_Pulse', 'dev_pulse', 'DEV_PULSE',
          )
          skip_dirs = {'.git', 'node_modules', '.next', 'dist', 'build', 'coverage', '.turbo'}
          failures = []
          for path in Path('.').rglob('*'):
              if any(part in skip_dirs for part in path.parts):
                  continue
              if any(n in path.name for n in needles):
                  failures.append(f'PATH {path}')
              if not path.is_file():
                  continue
              try:
                  raw = path.read_bytes()
                  if b'\x00' in raw[:8192]:
                      continue
                  text = raw.decode('utf-8')
              except (OSError, UnicodeDecodeError):
                  continue
              for index, line in enumerate(text.splitlines(), start=1):
                  if any(n in line for n in needles):
                      failures.append(f'TEXT {path}:{index}: {line[:240]}')
          if failures:
              print('\n'.join(failures[:500]))
              raise SystemExit('Retired naming remains in active tree')
          print('PASS: active tracked tree has no retired product naming.')
          PY

          if git ls-remote --heads --tags origin | grep -Eiq 'devpulse|dev[ _-]pulse'; then
            echo "Retired naming remains in a remote branch or tag:"
            git ls-remote --heads --tags origin | grep -Ei 'devpulse|dev[ _-]pulse' || true
            exit 1
          fi
          echo "PASS: remote branch/tag names contain no retired product naming."

      - name: Commit safety fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No tracked safety changes required."
            exit 0
          fi
          git commit -m "fix(brand): preserve RaksHex runtime semantics after rename"
          git push origin HEAD:investor-beta-ui-pass
