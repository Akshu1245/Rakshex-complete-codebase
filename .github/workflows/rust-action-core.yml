name: Rust action-core parity

on:
  pull_request:
    paths:
      - "rust/action-core/**"
      - "packages/action-control/src/rustParity.test.ts"
      - ".github/workflows/rust-action-core.yml"
  push:
    branches:
      - feat/rust-action-engine-foundation-20261013
    paths:
      - "rust/action-core/**"
      - "packages/action-control/src/rustParity.test.ts"
      - ".github/workflows/rust-action-core.yml"

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust format
        run: cargo fmt --manifest-path rust/action-core/Cargo.toml --all -- --check
      - name: Rust unit and parity tests
        run: cargo test --manifest-path rust/action-core/Cargo.toml --all-targets
      - name: Rust lint
        run: cargo clippy --manifest-path rust/action-core/Cargo.toml --all-targets -- -D warnings
