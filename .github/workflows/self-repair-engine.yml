name: Self-Repair engine

on:
  pull_request:
    paths: ["engine/**", ".github/workflows/self-repair-engine.yml"]
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/self-repair-engine.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-repair-engine-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: engine

jobs:
  test:
    name: Engine typecheck + unit/integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: engine/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  benchmark:
    name: Self-Repair accuracy regression gate (pinned Stripe specs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: engine/pnpm-lock.yaml
      - name: Install oasdiff v1.33.0 (sha256-pinned)
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o oasdiff.tgz https://github.com/oasdiff/oasdiff/releases/download/v1.33.0/oasdiff_1.33.0_linux_amd64.tar.gz
          echo "43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247  oasdiff.tgz" | sha256sum -c -
          tar xzf oasdiff.tgz oasdiff && echo "$PWD" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Run benchmark (dev set + frozen held-out set)
        working-directory: engine/apps/cli
        run: |
          npx tsx bench/self-repair/run.ts --set repos --out "$RUNNER_TEMP/bench-repos.json"
          npx tsx bench/self-repair/run.ts --set heldout --out "$RUNNER_TEMP/bench-heldout.json"
      - name: Regression gate (no false positives, no silent misses)
        run: |
          node -e '
            for (const f of ["bench-repos.json", "bench-heldout.json"]) {
              const t = require(process.env.RUNNER_TEMP + "/" + f).totals;
              console.log(f, JSON.stringify(t));
              if (t.fp > 0 || t.fnSilent > 0) { console.error("regression in " + f); process.exit(1); }
            }'
      - uses: actions/upload-artifact@v4
        with:
          name: self-repair-benchmark
          path: ${{ runner.temp }}/bench-*.json

  secrets:
    name: gitleaks (engine/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks v8.30.1 (sha256-pinned) over engine/
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks dir "$GITHUB_WORKSPACE/engine" --no-banner --redact --config "$GITHUB_WORKSPACE/engine/.gitleaks.toml"
