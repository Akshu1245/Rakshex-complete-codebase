name: Disposable Firewall Database Outage

on:
  pull_request:
    paths:
      - "apps/api/chaos/dbOutage.ts"
      - "apps/api/api/agentFirewall.ts"
      - ".github/workflows/firewall-db-outage.yml"
  push:
    branches:
      - fix/agent-evaluate-atomic-ledger-20261013
    paths:
      - "apps/api/chaos/dbOutage.ts"
      - "apps/api/api/agentFirewall.ts"
      - ".github/workflows/firewall-db-outage.yml"

permissions:
  contents: read

jobs:
  disposable-db-outage:
    if: github.repository == 'Akshu1245/Rakshex-complete-codebase'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      RAKSHEX_CHAOS_STAGING_ONLY: "1"
      NODE_ENV: test
      DATABASE_URL: postgresql://rakshex:rakshex@127.0.0.1:5434/rakshex_chaos
      REDIS_URL: redis://127.0.0.1:6384
      RAKSHEX_CHAOS_FIXTURE_PATH: /tmp/rakshex-chaos-fixture.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate ephemeral CI-only signing and vault keys
        run: |
          umask 077
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "RAKSHEX_VAULT_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Start isolated Postgres and Redis Docker containers
        run: |
          set -euo pipefail
          docker run -d --name rakshex-chaos-pg-ci \
            -e POSTGRES_USER=rakshex -e POSTGRES_PASSWORD=rakshex \
            -e POSTGRES_DB=rakshex_chaos \
            -p 127.0.0.1:5434:5432 postgres:15-alpine
          docker run -d --name rakshex-chaos-redis-ci \
            -p 127.0.0.1:6384:6379 redis:7-alpine
          for i in $(seq 1 30); do
            if docker exec rakshex-chaos-pg-ci pg_isready -U rakshex -d rakshex_chaos && \
              docker exec rakshex-chaos-redis-ci redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Migrate disposable database and seed test-only tenant
        run: |
          pnpm run db:migrate
          pnpm --filter @rakshex/api exec tsx chaos/dbOutage.ts seed
      - name: Probe healthy authorization
        run: pnpm --filter @rakshex/api exec tsx chaos/dbOutage.ts postgres_healthy
      - name: Kill disposable PostgreSQL and verify no action ALLOWs
        run: |
          set -euo pipefail
          docker stop rakshex-chaos-pg-ci
          trap 'docker start rakshex-chaos-pg-ci >/dev/null || true' EXIT
          pnpm --filter @rakshex/api exec tsx chaos/dbOutage.ts postgres_down
      - name: Confirm recovered PostgreSQL and authorization
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if docker exec rakshex-chaos-pg-ci pg_isready -U rakshex -d rakshex_chaos; then
              pnpm --filter @rakshex/api exec tsx chaos/dbOutage.ts postgres_recovered
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Kill disposable Redis and verify durable decision handling
        run: |
          set -euo pipefail
          docker stop rakshex-chaos-redis-ci
          trap 'docker start rakshex-chaos-redis-ci >/dev/null || true' EXIT
          pnpm --filter @rakshex/api exec tsx chaos/dbOutage.ts redis_down
      - name: Stop only the isolated chaos containers
        if: always()
        run: |
          docker rm -f rakshex-chaos-pg-ci rakshex-chaos-redis-ci >/dev/null 2>&1 || true
