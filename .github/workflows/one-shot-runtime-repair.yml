name: One-shot runtime repair

on:
  push:
    branches:
      - chatgpt/production-runtime-fixes-2026-09-05
    paths:
      - .github/workflows/one-shot-runtime-repair.yml

permissions:
  contents: write

jobs:
  apply-exact-runtime-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/production-runtime-fixes-2026-09-05
          fetch-depth: 0

      - name: Apply exact-match repairs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exact block once, found {count}")
              p.write_text(text.replace(old, new, 1))

          old_db = '''export async function getDb() {
            if (_db) return _db;
            if (!process.env.DATABASE_URL) return null;

            if (!_dbInitPromise) {
              _dbInitPromise = (async () => {
                try {
                  const pool = new Pool({
                    connectionString: process.env.DATABASE_URL,
                    max: 20,
                    idleTimeoutMillis: 30000,
                    connectionTimeoutMillis: 5000,
                  });
                  // Test the connection before caching
                  await pool.query("SELECT 1");
                  _db = drizzle(pool);
                  logger.info("[Database] Connection pool initialized");
                  return _db;
                } catch (error) {
                  logger.warn({ err: error }, "[Database] Failed to connect");
                  _db = null;
                  return null;
                }
              })();
            }

            return _dbInitPromise;
          }'''

          new_db = '''export async function getDb() {
            if (_db) return _db;
            if (!process.env.DATABASE_URL) return null;

            if (!_dbInitPromise) {
              let pool: Pool | null = null;
              _dbInitPromise = (async () => {
                try {
                  pool = new Pool({
                    connectionString: process.env.DATABASE_URL,
                    max: 20,
                    idleTimeoutMillis: 30000,
                    connectionTimeoutMillis: 5000,
                  });
                  // Test the connection before caching.
                  await pool.query("SELECT 1");
                  _db = drizzle(pool);
                  logger.info("[Database] Connection pool initialized");
                  return _db;
                } catch (error) {
                  logger.warn({ err: error }, "[Database] Failed to connect");
                  _db = null;
                  if (pool) {
                    await pool.end().catch(() => undefined);
                  }
                  return null;
                }
              })().finally(() => {
                // A failed first connection must not permanently poison the
                // single-flight promise. Let the next request retry cleanly.
                if (!_db) _dbInitPromise = null;
              });
            }

            return _dbInitPromise;
          }'''

          replace_once("apps/api/db.ts", old_db, new_db)

          old_dup = '''    if (err?.code === "ER_DUP_ENTRY" || err?.message?.includes("Duplicate entry")) {
                return { success: true, alreadyExists: true };
              }'''
          new_dup = '''    if (
                err?.code === "23505" ||
                err?.code === "ER_DUP_ENTRY" ||
                err?.message?.includes("Duplicate entry")
              ) {
                return { success: true, alreadyExists: true };
              }'''
          replace_once("apps/api/db.ts", old_dup, new_dup)

          old_pinger = '''    // ── Render Anti-Sleep Keep-Alive Pinger ──────────────────────────────────
              // Pings self every 10 minutes to prevent Render free-tier containers
              // from going to sleep after 15 minutes of inactivity.
              const pingTarget = process.env.RENDER_EXTERNAL_URL
                ? `${process.env.RENDER_EXTERNAL_URL.replace(/\\\/$/, "")}/api/health/live`
                : "https://rakshex-backend.onrender.com/api/health/live";

              logger.info({ pingTarget }, "[Render Keep-Alive] Anti-sleep pinger initialized (10m interval)");
              const antiSleepTimer = setInterval(
                async () => {
                  try {
                    const response = await fetch(pingTarget);
                    logger.info(
                      { status: response.status },
                      "[Render Keep-Alive] Self-ping pulse sent successfully — host active",
                    );
                  } catch (err) {
                    logger.warn(
                      { error: err instanceof Error ? err.message : String(err) },
                      "[Render Keep-Alive] Self-ping pulse ping warning",
                    );
                  }
                },
                10 * 60 * 1000,
              );
              antiSleepTimer.unref();
          '''
          replace_once("apps/api/_core/index.ts", old_pinger, "")

          replace_once(
              "apps/api/_core/index.ts",
              "// In production, bind exactly PORT so container HEALTHCHECK / Render probes\n  // never miss the process. Port scanning is a local-dev convenience only.",
              "// In production, bind exactly PORT so container and platform health probes\n  // never miss the process. Port scanning is a local-dev convenience only.",
          )
          PY

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Remove one-shot workflow and commit repairs
        shell: bash
        run: |
          git rm .github/workflows/one-shot-runtime-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/db.ts apps/api/_core/index.ts
          git commit -m "fix(runtime): recover DB init and remove Render anti-sleep [runtime-fix-applied]"
          git push origin HEAD:chatgpt/production-runtime-fixes-2026-09-05
