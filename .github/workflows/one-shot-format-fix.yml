name: One-shot format fix

on:
  push:
    branches:
      - chatgpt/production-runtime-fixes-2026-09-05
    paths:
      - .github/workflows/one-shot-format-fix.yml

permissions:
  contents: write

jobs:
  format-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/production-runtime-fixes-2026-09-05
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Apply repository Prettier
        run: pnpm exec prettier --write apps/api/_core/index.ts
      - name: Verify formatting
        run: pnpm exec prettier --check apps/api/_core/index.ts
      - name: Commit formatted file and remove helper
        shell: bash
        run: |
          git rm .github/workflows/one-shot-format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/_core/index.ts
          git commit -m "style(api): format runtime cleanup"
          git push origin HEAD:chatgpt/production-runtime-fixes-2026-09-05
