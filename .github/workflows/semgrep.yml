name: Semgrep SAST

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master, "akshu1245/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep CE
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.176.0
    steps:
      - uses: actions/checkout@v4
      - name: Scan application code
        run: >-
          semgrep scan
          --config p/typescript
          --config p/javascript
          --config p/nodejs
          --config p/owasp-top-ten
          --error
          --metrics=off
          --exclude node_modules
          --exclude .next
          --exclude dist
          --exclude coverage
          .
