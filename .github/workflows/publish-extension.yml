name: Publish VS Code Extension

on:
  workflow_dispatch:
    inputs:
      versionBump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      dryRun:
        description: "Dry run (package only; do not publish or push version commit)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  NODE_VERSION: "24"
  HUSKY: "0"

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vscode-extension

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install monorepo dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Verify extension
        working-directory: .
        run: |
          pnpm --filter rakshex-vscode typecheck
          pnpm --filter rakshex-vscode test
          pnpm --filter rakshex-vscode build

      - name: Validate package metadata
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const required = ['name','version','publisher','engines','categories','activationEvents','contributes','repository'];
          for (const key of required) {
            if (!pkg[key]) {
              console.error(`Missing required field: ${key}`);
              process.exit(1);
            }
          }
          if (pkg.name !== 'rakshex-vscode') throw new Error('Unexpected extension package name');
          if (!pkg.engines?.vscode) throw new Error('Missing engines.vscode');
          if (!pkg.publisher) throw new Error('Missing publisher');
          console.log(`Validated ${pkg.publisher}.${pkg.name}@${pkg.version}`);
          NODE

      - name: Bump package version
        run: |
          pnpm version "${{ inputs.versionBump }}" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Prepared extension version $VERSION"

      - name: Add changelog release entry
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const date = new Date().toISOString().slice(0, 10);
          const path = 'CHANGELOG.md';
          const current = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '# Changelog\n\n';
          const header = `## [${version}] - ${date}\n\n- Release prepared by the verified GitHub Actions extension workflow.\n\n`;
          const titleMatch = current.match(/^# .*\r?\n+/);
          const next = titleMatch
            ? `${titleMatch[0]}${header}${current.slice(titleMatch[0].length)}`
            : `# Changelog\n\n${header}${current}`;
          fs.writeFileSync(path, next);
          NODE

      - name: Package VSIX
        run: pnpm dlx @vscode/vsce package --out "rakshex-vscode-${{ env.VERSION }}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: rakshex-vscode-${{ env.VERSION }}
          path: apps/vscode-extension/rakshex-vscode-${{ env.VERSION }}.vsix
          if-no-files-found: error

      - name: Require marketplace token
        if: ${{ !inputs.dryRun }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT secret is required for marketplace publishing" >&2
            exit 1
          fi

      - name: Publish packaged VSIX to marketplace
        if: ${{ !inputs.dryRun }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm dlx @vscode/vsce publish --packagePath "rakshex-vscode-${{ env.VERSION }}.vsix" -p "$VSCE_PAT"

      - name: Commit version and changelog
        if: ${{ !inputs.dryRun }}
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/vscode-extension/package.json apps/vscode-extension/CHANGELOG.md
          git commit -m "chore(extension): release v${VERSION}"
          git tag "vscode-v${VERSION}"
          git push origin HEAD:${GITHUB_REF_NAME}
          git push origin "vscode-v${VERSION}"
