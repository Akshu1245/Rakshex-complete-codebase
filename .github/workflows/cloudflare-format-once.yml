# Temporary one-shot formatter, limited to the Cloudflare migration branch.
# Delete this workflow after it commits the formatted files.
name: Cloudflare formatter one-shot

on:
  push:
    branches:
      - feat/cloudflare-first-staging-20261012
    paths:
      - ".github/workflows/cloudflare-format-once.yml"

permissions:
  contents: write

jobs:
  format-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cloudflare-first-staging-20261012
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only files added by this PR
        run: pnpm exec prettier --write docs/cloudflare/MIGRATION_STATUS.md scripts/cloudflare/api-probe.test.mjs scripts/cloudflare/backend-origin.test.mjs
      - name: Commit formatting on the same feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cloudflare/MIGRATION_STATUS.md scripts/cloudflare/api-probe.test.mjs scripts/cloudflare/backend-origin.test.mjs
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style(cloudflare): format staging preflight files"
            git push origin HEAD:refs/heads/feat/cloudflare-first-staging-20261012
          fi
