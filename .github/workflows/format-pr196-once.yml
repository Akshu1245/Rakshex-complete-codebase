name: Format YC13 PR #196 once

on:
  push:
    branches:
      - feature/yc13-contract-diff-mvp-20261012

permissions:
  contents: write

jobs:
  format-pr196:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply repository Prettier and remove this temporary workflow
        run: |
          set -euo pipefail
          pnpm exec prettier --write packages/scanner-core/src/contractDiff.ts
          rm .github/workflows/format-pr196-once.yml
          git add packages/scanner-core/src/contractDiff.ts .github/workflows/format-pr196-once.yml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style(scanner): use canonical Prettier output; remove one-time formatter"
          git push origin HEAD:feature/yc13-contract-diff-mvp-20261012
