# The legacy Vercel project "rakshex-complete-codebase-api" is mislinked: the Express
# API runs on Railway/Docker, not Vercel. That project fails every push and leaves a
# red GitHub commit status even though web/ui deploys succeed.
#
# Poll until Vercel finishes (failure), then overwrite with success/skipped.
# Long-term fix: disconnect or delete the API project in the Vercel dashboard.
name: Vercel API skip status

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to update (defaults to branch HEAD)
        required: false
        type: string

permissions:
  contents: read
  statuses: write

env:
  VERCEL_API_STATUS_CONTEXT: Vercel – rakshex-complete-codebase-api
  SKIP_DESCRIPTION: Skipped — API deploys on Railway (see docs/DEPLOY_RAILWAY_VERCEL.md)

jobs:
  mark-api-vercel-skipped:
    name: Mark API Vercel check skipped
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Vercel API deploy to finish, then mark skipped
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          CONTEXT="$VERCEL_API_STATUS_CONTEXT"
          DEADLINE=$(( $(date +%s) + 600 ))

          fetch_state() {
            gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" \
              --jq "first(.statuses[] | select(.context == \"$CONTEXT\") | .state) // \"missing\"" 2>/dev/null || echo "missing"
          }

          fetch_description() {
            gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" \
              --jq "first(.statuses[] | select(.context == \"$CONTEXT\") | .description) // \"\"" 2>/dev/null || echo ""
          }

          mark_skipped() {
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state=success \
              -f context="$CONTEXT" \
              -f description="$SKIP_DESCRIPTION"
            echo "Marked $CONTEXT as skipped on $SHA"
          }

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            state=$(fetch_state)
            desc=$(fetch_description)

            if [ "$desc" = "$SKIP_DESCRIPTION" ]; then
              echo "Already marked skipped."
              exit 0
            fi

            if [ "$state" = "failure" ]; then
              mark_skipped
              exit 0
            fi

            if [ "$state" = "success" ]; then
              echo "Vercel API project reported success; leaving status unchanged."
              exit 0
            fi

            echo "Vercel API status: ${state:-pending} — waiting..."
            sleep 30
          done

          # Final attempt after timeout (Vercel may have failed without us catching pending→failure)
          state=$(fetch_state)
          if [ "$state" = "failure" ] || [ "$state" = "pending" ]; then
            mark_skipped
            exit 0
          fi

          echo "Timed out waiting for terminal Vercel API status (last state: $state)"
          exit 1
