# Disabled: the old workflow overwrote failed/pending Vercel deployment statuses
# with success, hiding real failures. Never mutate an external check's result.
#
# Legacy Vercel projects that should NOT stay Git-linked to this repo:
# - *-api / complete-codebase-api (API runs on Railway) — Git disconnected 2026-10-09
# - rakshex-ui (duplicate apps/web; canonical web is repo-root rakshex) — disconnect
#   in Vercel Settings → Git to stop duplicate statuses and Hobby rate-limit noise.
# ignoreCommand skips are in scripts/vercel-should-build.mjs; they do not replace
# disconnecting duplicate projects on Hobby when rate-limited.
name: Legacy Vercel duplicate projects notice (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "No GitHub status overrides. Disconnect legacy Vercel Git links:"
          echo "  - API *-api projects (Railway is canonical)"
          echo "  - rakshex-ui duplicate (repo-root rakshex is canonical web)"
          echo "See docs/DEPLOY_RAILWAY_VERCEL.md Phase 2."
