# The legacy Vercel project "rakshex-complete-codebase-api" is mislinked: the Express
# API runs on Railway/Docker, not Vercel. That project fails every push and leaves a
# red GitHub commit status even though web/ui deploys succeed.
#
# After Vercel reports failure, overwrite the status so main stays mergeable/green.
# Long-term fix: disconnect or delete the API project in the Vercel dashboard.
name: Vercel API skip status

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  statuses: write

env:
  VERCEL_API_STATUS_CONTEXT: Vercel – rakshex-complete-codebase-api

jobs:
  mark-api-vercel-skipped:
    name: Mark API Vercel check skipped
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Vercel to finish the API deployment attempt
        run: sleep 45

      - name: Overwrite failed API Vercel status with success (skipped)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" \
            --jq "first(.statuses[] | select(.context == \"$VERCEL_API_STATUS_CONTEXT\") | .state) // empty" || true)
          if [ "$state" = "success" ]; then
            echo "API Vercel status already success; nothing to do."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success \
            -f context="$VERCEL_API_STATUS_CONTEXT" \
            -f description="Skipped — API deploys on Railway (see docs/DEPLOY_RAILWAY_VERCEL.md)"
