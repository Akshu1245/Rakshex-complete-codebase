# pnpm monorepo: Dependabot must run only from the repo root (pnpm-lock.yaml +
# pnpm-workspace.yaml). Per-package directories fail with misconfigured_tooling
# ("Updating workspaces from inside a workspace subdirectory is not supported").
# Security pins (e.g. vitest 4.1.11) live in root package.json pnpm.overrides.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "Akshu1245"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
