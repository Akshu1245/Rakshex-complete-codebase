# Railway service: API (default)
# Create a second Railway service from the same repo with:
#   railway.toml → use railway.worker.toml settings (or set Docker target=worker in UI)
# and attach the same Postgres + Redis plugins / env vars.
#
# Required plugins: PostgreSQL, Redis
# Required env (API): see docs/DEPLOY_RAILWAY_VERCEL.md

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Explicit API target so the default CMD is the HTTP server
dockerBuildTarget = "api"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
# The runtime image deliberately excludes package devDependencies. Database
# migrations are TypeScript, so execute them with the API's production `tsx`
# dependency instead of relying on @rakshex/database's dev-only binary.
preDeployCommand = "./apps/api/node_modules/.bin/tsx packages/database/src/migrate.ts"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
