services:
  - type: web
    name: rakshex-backend
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile.prod
    dockerCommand: pnpm --filter @rakshex/database db:migrate && node --import tsx apps/api/_core/index.ts
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rakshex-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rakshex-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: RAKSHEX_VAULT_KEY
        sync: false
      - key: RAKSHEX_RECEIPT_SIGNING_PRIVATE_KEY
        sync: false
      - key: RAKSHEX_RECEIPT_SIGNING_KEY_ID
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GATEWAY_SERVICE_TOKEN
        sync: false
      - key: INTERNAL_SERVICE_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: worker
    name: rakshex-worker
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile.prod
    dockerCommand: node --import tsx apps/api/queues/workers/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rakshex-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rakshex-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: redis
    name: rakshex-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  - name: rakshex-db
    plan: free
    databaseName: rakshex
    user: rakshex

# Redis: create a Render Key Value instance named `rakshex-redis` and
# wire REDIS_URL via the dashboard if `fromService` redis is unavailable
# on your Render plan. The API fails closed without REDIS_URL in production.
