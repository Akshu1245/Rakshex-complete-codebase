# Real but narrow Cloudflare API staging slice. Not the Express/tRPC backend.
# NEVER bind rakshex-firewall production D1, KV, R2 or Queues here.
name = "rakshex-core-staging"
main = "./core-worker.mjs"
compatibility_date = "2026-10-12"
workers_dev = true

[vars]
ENVIRONMENT = "staging"

[[d1_databases]]
binding = "DB"
database_name = "rakshex-migration-staging"
database_id = "3e13ba92-e005-4220-a272-cb972a57bf9d"
migrations_dir = "./migrations"

[[kv_namespaces]]
binding = "CONFIG_KV"
id = "c70babd55491444e96046824fde32224"

[[queues.producers]]
binding = "JOBS"
queue = "rakshex-migration-staging-jobs"

[[queues.consumers]]
queue = "rakshex-migration-staging-jobs"
max_batch_size = 5
max_batch_timeout = 3
max_retries = 3
dead_letter_queue = "rakshex-migration-staging-dlq"

[[r2_buckets]]
binding = "OBJECTS"
bucket_name = "rakshex-migration-staging-objects"
